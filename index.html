<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#254F23" />
    <title>Сообщения — Alterlit</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap&subset=cyrillic"
      rel="stylesheet"
    />
    <script>
      // Оформление и обои — до загрузки скрипта, чтобы не мигали.
      // Повторяет src/utils/appearance.ts: при изменении ключей или шрифтов править и там.
      (function () {
        var d = document.documentElement, t = null, a = null, w = null;
        try {
          t = localStorage.getItem('alterlit-chat-theme');
          a = JSON.parse(localStorage.getItem('alterlit-chat-appearance'));
          w = localStorage.getItem('alterlit-chat-wallpaper');
        } catch (e) {}
        a = a || {};
        var dark = t === 'dark' || (t !== 'light' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        d.dataset.palette = (dark ? a.dark : a.light) || (dark ? 'pine' : 'sage');
        if (a.size === 's' || a.size === 'l') d.dataset.size = a.size;
        var fonts = {
          ptsans: 'https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap',
          literata: 'https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&display=swap'
        };
        if (a.font === 'ptsans' || a.font === 'literata') {
          d.dataset.font = a.font;
          var l = document.createElement('link');
          l.id = 'font-' + a.font;
          l.rel = 'stylesheet';
          l.href = fonts[a.font];
          document.head.appendChild(l);
        }
        if (w) d.dataset.wp = w;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
