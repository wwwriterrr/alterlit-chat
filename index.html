<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#254F23" />
    <title>Сообщения — Alterlit</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap&subset=cyrillic"
      rel="stylesheet"
    />
    <script>
      try {
        // тема и обои — до загрузки скрипта, чтобы не мигали
        var t = localStorage.getItem('alterlit-chat-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var w = localStorage.getItem('alterlit-chat-wallpaper');
        if (w) document.documentElement.dataset.wp = w;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
